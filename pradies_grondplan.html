<!DOCTYPE html>
<html lang="fr">
<head>

<title>Grondplan Domaine des Pradiès</title>
<style>
  body { background: #f0ede6; display: flex; justify-content: center; padding: 30px; font-family: Arial, sans-serif; }

  .page { overflow-x: auto; }
  .page svg { max-width: 100%; height: auto; }

<body>
<div class="page">

  <!-- ===== SCALE NOTE =====
    Real measurements from plan:
    Horizontal total house: ~11.54m (5.27 + 1.00 + 5.27 approx)
    Vertical upper zone: ~5.78m (salle height)
    We map: 1m ≈ 50px
    House inner width: ~565px  height upper: ~290px  lower: ~235px
    Origin (inner top-left): x=100, y=190
  -->

  <!-- BOTTOM OUTER WALL -->
  <rect x="86" y="924" width="582" height="14" fill="#666"/>

  <rect x="86" y="176" width="14" height="762" fill="#666"/>

  <rect x="654" y="176" width="14" height="762" fill="#666"/>

  <line x1="674" y1="612" x2="758" y2="612" stroke="#999" stroke-width="1"/>
  <line x1="674" y1="628" x2="758" y2="628" stroke="#999" stroke-width="1"/>
